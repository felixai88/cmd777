<!-- =====================================================================
     DAFTAR CABANG FORM BAST GUDANG — ambil dari sheet "CABANG"
     Cara pasang (di project Apps Script Form BAST Gudang):
     1. Buka file HTML form BAST (yang berisi dropdown "— pilih cabang —").
     2. Tempel SELURUH blok <script> di bawah ini tepat SEBELUM tag </body>.
     3. Deploy > Manage deployments > Edit > Version: New version > Deploy.
     Dropdown akan diisi ulang dari sheet CABANG setiap form dibuka.
     Kalau server tidak terjangkau, daftar cabang lama di form tetap dipakai.
     ===================================================================== -->
<script>
(function () {
  /* link Web App dashboard (Api.gs) — sama dengan API_URL di index.html dashboard */
  var API_URL = "https://script.google.com/macros/s/AKfycbwxXSa-96P_nS9BL_QH8OXChZQFlT3rrKTXNY7nPZiBs616kXO_FduIuTJ64L9cLua_FQ/exec";

  /* cari dropdown cabang: <select> yang opsi pertamanya berisi "pilih cabang" */
  function cariDropdown() {
    return Array.prototype.filter.call(document.querySelectorAll("select"), function (s) {
      return s.options.length && /pilih\s*cabang/i.test(s.options[0].text);
    });
  }
  function isi(daftar) {
    if (!Array.isArray(daftar) || !daftar.length) return;
    daftar = daftar.slice().sort(function (a, b) { return a.kode.localeCompare(b.kode); });
    cariDropdown().forEach(function (sel) {
      var lama = sel.value, kepala = sel.options[0].outerHTML;
      sel.innerHTML = kepala + daftar.map(function (c) {
        var label = c.nama && c.nama !== c.kode ? c.kode + " — " + c.nama : c.kode;
        return '<option value="' + c.kode + '">' + label + "</option>";
      }).join("");
      if (lama) {
        if (!Array.prototype.some.call(sel.options, function (o) { return o.value === lama; }))
          sel.insertAdjacentHTML("beforeend", '<option value="' + lama + '">' + lama + "</option>");
        sel.value = lama;
      }
    });
  }
  function muat() {
    /* 1) kalau form ini satu project dengan getDaftarCabang -> langsung */
    try {
      if (window.google && google.script && google.script.run && typeof google.script.run.getDaftarCabang === "function") {
        google.script.run.withSuccessHandler(isi).withFailureHandler(lewatApi).getDaftarCabang();
        return;
      }
    } catch (e) {}
    lewatApi();
  }
  /* 2) kalau beda project -> ambil lewat Api.gs dashboard */
  function lewatApi() {
    fetch(API_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify({ fn: "getDaftarCabang", args: [] }),
      redirect: "follow"
    }).then(function (r) { return r.json(); })
      .then(function (res) { if (res && res.ok) isi(res.data); })
      .catch(function () { /* tetap pakai daftar lama */ });
  }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", muat); else muat();
})();
</script>
